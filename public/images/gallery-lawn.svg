<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="lwnSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf8f1"/>
      <stop offset="1" stop-color="#f4ecd8"/>
    </linearGradient>
    <linearGradient id="lwnLawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ea05c"/>
      <stop offset="1" stop-color="#3a6a2f"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#lwnSky)"/>
  <rect y="180" width="600" height="420" fill="url(#lwnLawn)"/>
  <!-- alternating mow stripes -->
  <g>
    <rect y="220" width="600" height="50" fill="#4d8540" opacity="0.55"/>
    <rect y="320" width="600" height="50" fill="#4d8540" opacity="0.55"/>
    <rect y="420" width="600" height="50" fill="#4d8540" opacity="0.55"/>
    <rect y="520" width="600" height="50" fill="#4d8540" opacity="0.55"/>
  </g>
  <!-- crisp edge -->
  <rect y="178" width="600" height="4" fill="#dabd83"/>
  <!-- distant trees -->
  <ellipse cx="80" cy="170" rx="60" ry="50" fill="#3a6a2f" opacity="0.7"/>
  <ellipse cx="500" cy="170" rx="70" ry="55" fill="#3a6a2f" opacity="0.7"/>
  <ellipse cx="280" cy="160" rx="50" ry="42" fill="#4d8540" opacity="0.7"/>
</svg>
