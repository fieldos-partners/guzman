<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="al2Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf8f1"/>
      <stop offset="1" stop-color="#f4ecd8"/>
    </linearGradient>
    <linearGradient id="al2Lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ea05c"/>
      <stop offset="1" stop-color="#274422"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#al2Sky)"/>
  <!-- distant clean hedge -->
  <rect y="360" width="1600" height="40" fill="#3a6a2f"/>
  <rect y="358" width="1600" height="4" fill="#dabd83"/>
  <rect y="380" width="1600" height="520" fill="url(#al2Lawn)"/>
  <!-- alternating diagonal stripes -->
  <g>
    <rect y="430" width="1600" height="60" fill="#4d8540" opacity="0.55"/>
    <rect y="540" width="1600" height="60" fill="#4d8540" opacity="0.55"/>
    <rect y="650" width="1600" height="60" fill="#4d8540" opacity="0.55"/>
    <rect y="760" width="1600" height="60" fill="#4d8540" opacity="0.55"/>
  </g>
  <!-- crisp edge highlight -->
  <rect y="378" width="1600" height="3" fill="#9bbe8e"/>
  <!-- single sculpted topiary -->
  <g transform="translate(1280 360)">
    <rect x="-6" y="40" width="12" height="60" fill="#3a2a1c"/>
    <ellipse cx="0" cy="0" rx="50" ry="60" fill="#274422"/>
    <ellipse cx="0" cy="-25" rx="35" ry="40" fill="#3a6a2f"/>
  </g>
  <g transform="translate(280 360)">
    <rect x="-6" y="40" width="12" height="60" fill="#3a2a1c"/>
    <ellipse cx="0" cy="0" rx="50" ry="60" fill="#274422"/>
    <ellipse cx="0" cy="-25" rx="35" ry="40" fill="#3a6a2f"/>
  </g>
</svg>
