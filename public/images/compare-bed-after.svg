<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ab1Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf8f1"/>
      <stop offset="1" stop-color="#e9d9b2"/>
    </linearGradient>
    <linearGradient id="ab1Bed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a22"/>
      <stop offset="1" stop-color="#3a2010"/>
    </linearGradient>
    <linearGradient id="ab1Lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ea05c"/>
      <stop offset="1" stop-color="#3a6a2f"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#ab1Sky)"/>
  <!-- crisp house siding -->
  <rect y="200" width="1600" height="380" fill="#fbf8f1"/>
  <rect y="200" width="1600" height="6" fill="#dabd83"/>
  <!-- windows -->
  <rect x="180" y="280" width="160" height="180" fill="#9bbe8e"/>
  <rect x="720" y="280" width="160" height="180" fill="#9bbe8e"/>
  <rect x="1260" y="280" width="160" height="180" fill="#9bbe8e"/>
  <!-- mulch bed -->
  <rect y="580" width="1600" height="180" fill="url(#ab1Bed)"/>
  <rect y="578" width="1600" height="4" fill="#dabd83"/>
  <!-- shaped boxwood domes -->
  <g>
    <ellipse cx="240" cy="580" rx="120" ry="80" fill="#274422"/>
    <ellipse cx="240" cy="555" rx="80" ry="55" fill="#3a6a2f"/>
    <ellipse cx="780" cy="580" rx="140" ry="90" fill="#274422"/>
    <ellipse cx="780" cy="555" rx="95" ry="60" fill="#3a6a2f"/>
    <ellipse cx="1320" cy="580" rx="120" ry="80" fill="#274422"/>
    <ellipse cx="1320" cy="555" rx="80" ry="55" fill="#3a6a2f"/>
  </g>
  <!-- ornamental grasses between -->
  <g stroke="#cda058" stroke-width="3" fill="none" opacity="0.9">
    <path d="M460 660 Q 462 600 472 555"/>
    <path d="M475 660 Q 480 600 490 555"/>
    <path d="M490 660 Q 492 600 500 558"/>
    <path d="M1080 660 Q 1082 600 1092 555"/>
    <path d="M1095 660 Q 1100 600 1110 555"/>
    <path d="M1110 660 Q 1112 600 1120 558"/>
  </g>
  <!-- crisp lawn -->
  <rect y="760" width="1600" height="140" fill="url(#ab1Lawn)"/>
  <g opacity="0.18" fill="#0e1e0c">
    <rect y="800" width="1600" height="12"/>
    <rect y="850" width="1600" height="12"/>
  </g>
</svg>
