<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="pSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf8f1"/>
      <stop offset="1" stop-color="#f4ecd8"/>
    </linearGradient>
    <linearGradient id="pLawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d8540"/>
      <stop offset="1" stop-color="#274422"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#pSky)"/>
  <rect y="160" width="600" height="440" fill="url(#pLawn)"/>
  <!-- stepping stones in perspective -->
  <g fill="#dabd83" stroke="#a8843c" stroke-width="2">
    <ellipse cx="300" cy="220" rx="34" ry="11"/>
    <ellipse cx="300" cy="280" rx="42" ry="13"/>
    <ellipse cx="300" cy="350" rx="50" ry="15"/>
    <ellipse cx="300" cy="430" rx="60" ry="17"/>
    <ellipse cx="300" cy="525" rx="72" ry="20"/>
  </g>
  <!-- border shrubs -->
  <ellipse cx="60" cy="200" rx="60" ry="40" fill="#274422"/>
  <ellipse cx="540" cy="200" rx="60" ry="40" fill="#274422"/>
  <ellipse cx="40" cy="320" rx="60" ry="38" fill="#3a6a2f"/>
  <ellipse cx="560" cy="320" rx="60" ry="38" fill="#3a6a2f"/>
  <ellipse cx="20" cy="460" rx="70" ry="42" fill="#274422"/>
  <ellipse cx="580" cy="460" rx="70" ry="42" fill="#274422"/>
</svg>
