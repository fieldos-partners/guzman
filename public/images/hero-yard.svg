<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf8f1"/>
      <stop offset="0.6" stop-color="#f4ecd8"/>
      <stop offset="1" stop-color="#e9d9b2"/>
    </linearGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ea05c"/>
      <stop offset="1" stop-color="#3a6a2f"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9bbe8e"/>
      <stop offset="1" stop-color="#6ea05c"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.7" cy="0.25" r="0.25">
      <stop offset="0" stop-color="#fff5d6" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff5d6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#sky)"/>
  <rect width="800" height="1000" fill="url(#sun)"/>

  <!-- distant hills -->
  <path d="M0 540 Q 200 460 400 510 T 800 500 L 800 1000 L 0 1000 Z" fill="url(#hillFar)" opacity="0.55"/>
  <path d="M0 600 Q 220 540 460 580 T 800 570 L 800 1000 L 0 1000 Z" fill="#6ea05c" opacity="0.8"/>

  <!-- lawn -->
  <path d="M0 660 Q 260 620 480 660 T 800 660 L 800 1000 L 0 1000 Z" fill="url(#lawn)"/>

  <!-- mowing stripes -->
  <g opacity="0.18" fill="#1f361c">
    <path d="M0 700 Q 260 680 480 700 T 800 700 L 800 730 Q 480 720 260 730 T 0 730 Z"/>
    <path d="M0 800 Q 260 780 480 800 T 800 800 L 800 830 Q 480 820 260 830 T 0 830 Z"/>
    <path d="M0 900 Q 260 880 480 900 T 800 900 L 800 930 Q 480 920 260 930 T 0 930 Z"/>
  </g>

  <!-- left tree -->
  <g transform="translate(120 360)">
    <rect x="-8" y="200" width="16" height="120" fill="#3a2a1c"/>
    <ellipse cx="0" cy="180" rx="120" ry="180" fill="#3a6a2f"/>
    <ellipse cx="-30" cy="120" rx="90" ry="130" fill="#4d8540" opacity="0.85"/>
    <ellipse cx="40" cy="160" rx="80" ry="110" fill="#6ea05c" opacity="0.8"/>
  </g>

  <!-- right tree -->
  <g transform="translate(660 420)">
    <rect x="-6" y="160" width="12" height="100" fill="#3a2a1c"/>
    <ellipse cx="0" cy="150" rx="90" ry="140" fill="#3a6a2f"/>
    <ellipse cx="20" cy="100" rx="65" ry="100" fill="#6ea05c" opacity="0.85"/>
  </g>

  <!-- shrubs -->
  <ellipse cx="320" cy="650" rx="50" ry="22" fill="#274422"/>
  <ellipse cx="380" cy="660" rx="40" ry="18" fill="#2f5527"/>
  <ellipse cx="540" cy="640" rx="60" ry="24" fill="#274422"/>

  <!-- stone path -->
  <g fill="#dabd83" opacity="0.85">
    <ellipse cx="400" cy="780" rx="42" ry="14"/>
    <ellipse cx="430" cy="830" rx="44" ry="14"/>
    <ellipse cx="395" cy="880" rx="42" ry="14"/>
    <ellipse cx="425" cy="935" rx="46" ry="14"/>
  </g>
</svg>
