<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4ecd8"/>
      <stop offset="1" stop-color="#e9d9b2"/>
    </linearGradient>
    <linearGradient id="lawn3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ea05c"/>
      <stop offset="1" stop-color="#3a6a2f"/>
    </linearGradient>
  </defs>
  <rect width="2000" height="1000" fill="url(#sky3)"/>

  <!-- house -->
  <g transform="translate(1100 360)">
    <rect x="0" y="80" width="380" height="220" fill="#fbf8f1"/>
    <polygon points="0,80 190,-20 380,80" fill="#3a2a1c"/>
    <rect x="40" y="180" width="80" height="120" fill="#274422"/>
    <rect x="170" y="160" width="60" height="60" fill="#9bbe8e"/>
    <rect x="270" y="160" width="60" height="60" fill="#9bbe8e"/>
  </g>

  <!-- distant ridge -->
  <path d="M0 500 Q 500 440 1000 470 T 2000 460 L 2000 1000 L 0 1000 Z" fill="#9bbe8e" opacity="0.6"/>
  <path d="M0 580 Q 500 520 1000 560 T 2000 550 L 2000 1000 L 0 1000 Z" fill="#6ea05c" opacity="0.85"/>

  <!-- lawn -->
  <path d="M0 660 L 2000 660 L 2000 1000 L 0 1000 Z" fill="url(#lawn3)"/>
  <g opacity="0.18" fill="#1f361c">
    <rect x="0" y="700" width="2000" height="14"/>
    <rect x="0" y="780" width="2000" height="14"/>
    <rect x="0" y="860" width="2000" height="14"/>
    <rect x="0" y="940" width="2000" height="14"/>
  </g>

  <!-- left tree -->
  <g transform="translate(280 320)">
    <rect x="-10" y="240" width="20" height="120" fill="#3a2a1c"/>
    <ellipse cx="0" cy="200" rx="160" ry="220" fill="#3a6a2f"/>
    <ellipse cx="-40" cy="140" rx="110" ry="160" fill="#4d8540" opacity="0.85"/>
    <ellipse cx="50" cy="190" rx="95" ry="140" fill="#6ea05c" opacity="0.8"/>
  </g>

  <!-- shrubs along house -->
  <g>
    <ellipse cx="1080" cy="660" rx="60" ry="22" fill="#274422"/>
    <ellipse cx="1160" cy="670" rx="50" ry="20" fill="#2f5527"/>
    <ellipse cx="1380" cy="660" rx="70" ry="24" fill="#274422"/>
    <ellipse cx="1500" cy="670" rx="55" ry="20" fill="#2f5527"/>
  </g>

  <!-- mulch bed -->
  <ellipse cx="1280" cy="700" rx="320" ry="32" fill="#5a3a22"/>
  <ellipse cx="1280" cy="700" rx="320" ry="20" fill="#4a2e1a"/>

  <!-- stepping path -->
  <g fill="#dabd83">
    <ellipse cx="700" cy="780" rx="60" ry="16"/>
    <ellipse cx="820" cy="830" rx="62" ry="16"/>
    <ellipse cx="940" cy="880" rx="64" ry="16"/>
    <ellipse cx="1060" cy="930" rx="66" ry="16"/>
  </g>
</svg>
