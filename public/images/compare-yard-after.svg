<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="aSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf8f1"/>
      <stop offset="1" stop-color="#e9d9b2"/>
    </linearGradient>
    <linearGradient id="aLawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ea05c"/>
      <stop offset="1" stop-color="#3a6a2f"/>
    </linearGradient>
    <linearGradient id="aMulch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a22"/>
      <stop offset="1" stop-color="#3a2010"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#aSky)"/>

  <!-- house -->
  <g transform="translate(960 280)">
    <rect x="0" y="80" width="500" height="280" fill="#fbf8f1"/>
    <polygon points="0,80 250,-30 500,80" fill="#3a2a1c"/>
    <rect x="60" y="220" width="100" height="140" fill="#274422"/>
    <rect x="220" y="200" width="80" height="80" fill="#9bbe8e"/>
    <rect x="350" y="200" width="80" height="80" fill="#9bbe8e"/>
  </g>

  <!-- crisp lawn -->
  <rect y="540" width="1600" height="360" fill="url(#aLawn)"/>

  <!-- mowing stripes -->
  <g opacity="0.18" fill="#0e1e0c">
    <rect y="600" width="1600" height="22"/>
    <rect y="680" width="1600" height="22"/>
    <rect y="760" width="1600" height="22"/>
    <rect y="840" width="1600" height="22"/>
  </g>

  <!-- mulch bed in front of house -->
  <rect x="940" y="540" width="540" height="80" fill="url(#aMulch)"/>
  <rect x="940" y="538" width="540" height="4" fill="#dabd83"/>

  <!-- shaped shrubs -->
  <g>
    <rect x="1000" y="470" width="120" height="90" rx="14" fill="#274422"/>
    <rect x="1000" y="470" width="120" height="14" fill="#3a6a2f"/>
    <rect x="1180" y="450" width="120" height="110" rx="14" fill="#274422"/>
    <rect x="1180" y="450" width="120" height="14" fill="#3a6a2f"/>
    <rect x="1340" y="475" width="120" height="85" rx="14" fill="#274422"/>
    <rect x="1340" y="475" width="120" height="14" fill="#3a6a2f"/>
  </g>

  <!-- ornamental grass clumps -->
  <g stroke="#cda058" stroke-width="3" fill="none" opacity="0.85">
    <path d="M970 600 Q 970 555 980 525"/>
    <path d="M980 600 Q 985 555 995 528"/>
    <path d="M990 600 Q 995 555 1003 530"/>
    <path d="M1430 600 Q 1430 555 1440 525"/>
    <path d="M1440 600 Q 1445 555 1455 528"/>
    <path d="M1450 600 Q 1455 555 1463 530"/>
  </g>

  <!-- stepping stones path -->
  <g fill="#dabd83">
    <ellipse cx="200" cy="700" rx="60" ry="14"/>
    <ellipse cx="320" cy="760" rx="64" ry="15"/>
    <ellipse cx="440" cy="820" rx="68" ry="16"/>
  </g>

  <!-- single ornamental tree on left -->
  <g transform="translate(680 380)">
    <rect x="-8" y="180" width="16" height="80" fill="#3a2a1c"/>
    <ellipse cx="0" cy="160" rx="100" ry="140" fill="#3a6a2f"/>
    <ellipse cx="-30" cy="120" rx="70" ry="100" fill="#4d8540" opacity="0.85"/>
  </g>
</svg>
